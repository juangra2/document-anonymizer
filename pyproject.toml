[project]
name = "document-anonymizer"
version = "0.1.0"
description = "API backend for irreversible PDF anonymization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMuPDF>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pillow",
    "numpy",
    "easyocr",
    "opencv-python",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["samples*", "tests*"]