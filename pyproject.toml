[project]
name = "document-anonymizer"
version = "0.1.0"
description = "API backend for irreversible PDF anonymization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMuPDF>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pillow",
    "numpy",
    "easyocr",
    "opencv-python",
    # QR + códigos de barras lineales (Code128/39, EAN/UPC, PDF417…).
    "pyzbar",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=4.0",
]
# MinerU 2.5-Pro (motor OCR principal, VLM).  El motor importa mineru_vl_utils.
# Pesos: hf download opendatalab/MinerU2.5-Pro-2604-1.2B --local-dir model/MinerU2.5-Pro-2604-1.2B
mineru = [
    "mineru-vl-utils[transformers]>=0.2.7",
]
# Older magic-pdf package name (MinerU <1.0)
magic-pdf = [
    "magic-pdf[full]>=0.9",
]
# Transformer NER backend (Presidio TransformersNlpEngine).
# Enable at runtime with NER_ENGINE=transformers.
transformers-ner = [
    "spacy-huggingface-pipelines",
    "transformers>=4.40",
    "torch",
]

# Build-time only: regenerate INE gazetteers via scripts/build_gazetteers.py.
# Runtime uses the pre-built text artefacts in app/services/pii/gazetteers/.
gazetteer-build = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lento`: pruebas que pasan documentos enteros por el pipeline con OCR y tardan
# minutos.  Corren por defecto —la suite completa antes de cada commit
# relevante— y se pueden excluir en local con:  pytest -m "not lento"
markers = [
    "lento: pasa documentos completos por el pipeline con OCR (minutos)",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["samples*", "tests*"]