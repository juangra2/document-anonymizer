[project]
name = "document-anonymizer"
version = "0.1.0"
description = "API backend for irreversible PDF anonymization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyMuPDF>=1.24",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pillow",
    "numpy",
    "easyocr",
    "opencv-python",
    # QR + códigos de barras lineales (Code128/39, EAN/UPC, PDF417…).
    "pyzbar",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=4.0",
]
# MinerU 2.5 document-understanding engine (primary OCR backend).
# Install weights after: mineru-models-download -m pipeline
mineru = [
    "mineru[full]>=1.0",
]
# Older magic-pdf package name (MinerU <1.0)
magic-pdf = [
    "magic-pdf[full]>=0.9",
]
# Transformer NER backend (Presidio TransformersNlpEngine).
# Enable at runtime with NER_ENGINE=transformers.
transformers-ner = [
    "spacy-huggingface-pipelines",
    "transformers>=4.40",
    "torch",
]

# Build-time only: regenerate INE gazetteers via scripts/build_gazetteers.py.
# Runtime uses the pre-built text artefacts in app/services/pii/gazetteers/.
gazetteer-build = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["samples*", "tests*"]